<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="導線走線大師老師投影頁：開房間、即時排行榜、頒獎台。">
<title>導線走線大師 · 老師投影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout：投影幕舞台。深藍底，大字。大廳＝左 QR、右房間代碼與名單；排行榜＝上方狀態列＋每人一列的時空地圖進度；頒獎台＝三根柱子。只有一種深色外觀，方便投影。 */
:root{
  --bg:#10143a; --bg2:#1a2160; --panel:#1d2458; --line:#323b7e; --ink:#f3f4ff; --muted:#a7aedb;
  --navy:#8fa2ff; --accent:#ffd166; --oxide:#e48fcb; --si:#c9cfe4; --chip:#2b3f8a;
  --m1:#f2b733; --m2:#2fd0bd; --ok:#4ccf86; --danger:#ff6a52;
  --gold:#ffcc3d; --silver:#cfd6e6; --bronze:#e0995e;
  --f-display:"Chiron GoRound TC","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
.wrap{min-height:100%;padding:clamp(16px,2.4vw,36px);display:flex;flex-direction:column;gap:clamp(14px,2vh,24px)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand .eb{font-family:var(--f-mono);font-size:13px;letter-spacing:.16em;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3vw,40px);letter-spacing:.06em}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:17px;border-radius:14px;padding:11px 20px;cursor:pointer;border:2px solid var(--navy);background:var(--navy);color:#10143a}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.huge{font-family:var(--f-display);font-size:clamp(26px,3vw,40px);padding:16px 48px;border-radius:20px;background:var(--accent);border-color:var(--accent);color:#10143a;letter-spacing:.08em}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chipName:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:84px}
.stat b{font-family:var(--f-mono);font-size:clamp(24px,2.6vw,36px);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);letter-spacing:.08em}
.pinMini{font-family:var(--f-mono);font-weight:700;font-size:clamp(20px,2vw,28px);letter-spacing:.2em;color:var(--accent)}

/* 首頁 */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.home img{width:150px;height:150px;border-radius:26px;object-fit:cover;border:4px solid var(--line)}
.home p{margin:0;color:var(--muted);font-size:18px;max-width:40ch;line-height:1.7}
.note{color:var(--muted);font-size:15px}
.note.warn{color:var(--accent)}

/* 大廳 */
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:clamp(18px,3vw,48px);align-items:start}
@media (max-width:900px){.lobby{grid-template-columns:minmax(0,1fr)}}
.qrCard{background:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#10143a}
.qrCard .qr img,.qrCard .qr canvas{width:min(34vh,340px)!important;height:auto!important}
.qrCard .u{font-family:var(--f-mono);font-size:15px;text-align:center;word-break:break-all;max-width:340px}
.pinBox .lab{font-size:clamp(18px,1.8vw,24px);color:var(--muted)}
.pinBox .pin{font-family:var(--f-mono);font-weight:700;font-size:clamp(72px,11vw,150px);letter-spacing:.12em;line-height:1;color:var(--accent)}
.pinBox .how{font-size:clamp(17px,1.6vw,22px);color:var(--ink);margin:10px 0 0;line-height:1.6}
.joined{display:flex;align-items:baseline;gap:12px;margin:24px 0 12px;font-family:var(--f-display);font-size:clamp(22px,2.2vw,30px);font-weight:900}
.joined b{font-family:var(--f-mono);font-size:1.4em;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipName{font:inherit;font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
.chipName.confirm{border-color:var(--danger);color:var(--danger)}
.lobbyAct{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:26px}

/* 排行榜 */
.boardHead,.row{display:grid;grid-template-columns:64px minmax(0,1.3fr) minmax(0,2.6fr) 120px 110px;gap:14px;align-items:center}
.boardHead{font-size:15px;color:var(--muted);letter-spacing:.04em;padding:0 16px}
.stopsHead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.stopsHead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stopsHead em{display:none;font-style:normal;font-family:var(--f-mono);font-weight:700}
.stopsHead b{font-weight:500}
@media (max-width:1100px){.stopsHead em{display:inline}.stopsHead b{display:none}}
.rows{position:relative;display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 16px;min-height:62px}
.row .rk{font-family:var(--f-display);font-weight:900;font-size:28px;text-align:center;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bg);margin:auto}
.row:nth-child(1) .rk{background:var(--gold);color:#10143a}
.row:nth-child(2) .rk{background:var(--silver);color:#10143a}
.row:nth-child(3) .rk{background:var(--bronze);color:#10143a}
.row .nm{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.row .nm small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.row .nm.confirm{color:var(--danger)}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center}
.track i{height:12px;background:var(--line);position:relative}
.track i:first-child{border-radius:6px 0 0 6px}.track i:last-child{border-radius:0 6px 6px 0}
.track i.on{background:var(--ok)}
.track i.now{background:var(--accent)}
.track i.now::after{content:"";position:absolute;right:-9px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(255,209,102,.25)}
.track.fin i{background:var(--ok)}
.parts{display:flex;gap:4px}
.parts span{width:18px;height:18px;border-radius:5px;border:2px dashed var(--line)}
.parts span.got{border:none}
.score{font-family:var(--f-mono);font-weight:700;font-size:clamp(24px,2.4vw,34px);text-align:right;font-variant-numeric:tabular-nums}
.done{display:inline-block;font-size:12px;font-weight:700;color:#10143a;background:var(--ok);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.rows.compact .row{min-height:44px;padding:6px 14px}
.rows.compact .row .rk{width:34px;height:34px;font-size:20px}
.rows.compact .row .nm{font-size:20px}
.rows.compact .score{font-size:22px}
.rows.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:column;gap:8px 16px}
.rows.two .row{grid-template-columns:40px minmax(0,1fr) minmax(0,1.6fr) 80px}
.rows.two .parts{display:none}
.boardHead.two{display:none}
.empty{color:var(--muted);text-align:center;padding:40px;font-size:20px}
.legend{font-size:14px;color:var(--muted)}

/* 頒獎台 */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,2vw,28px);margin-top:10px;min-height:46vh}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(26vw,260px)}
.col .who{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,2.6vw,36px);text-align:center;opacity:0;transform:translateY(10px);transition:.5s}
.col .pts{font-family:var(--f-mono);font-weight:700;font-size:clamp(18px,2vw,26px);color:var(--muted);opacity:0;transition:.5s}
.col .bar{width:100%;border-radius:18px 18px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-family:var(--f-display);font-weight:900;font-size:clamp(40px,5vw,72px);color:#10143a;height:0;transition:height 1s cubic-bezier(.2,.9,.3,1.2)}
.col.p1 .bar{background:var(--gold)} .col.p2 .bar{background:var(--silver)} .col.p3 .bar{background:var(--bronze)}
.col.show .who,.col.show .pts{opacity:1;transform:none}
.rest{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.rest span{background:var(--panel);border-radius:12px;padding:6px 14px;font-size:17px}
.rest span b{font-family:var(--f-mono);color:var(--muted);margin-right:8px}
.statCard{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px 26px;width:min(1100px,100%);max-height:calc(100vh - 32px);overflow:auto}
.statHead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 24px}
.statHead h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,2.6vw,34px);letter-spacing:.04em}
.statHead p{margin:6px 0 0;color:var(--muted);font-size:16px;max-width:52ch}
.statTable{width:100%;border-collapse:collapse;margin-top:16px;font-size:clamp(16px,1.5vw,20px)}
.statTable th{font-size:14px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
.statTable td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.statTable td small{display:block;color:var(--muted);font-size:13px}
.statTable .num{text-align:right;white-space:nowrap;font-family:var(--f-mono)}
.statTable .num b{font-size:1.4em;color:var(--accent)}
.pbar{display:inline-block;width:140px;height:12px;border-radius:6px;background:var(--bg);vertical-align:middle;overflow:hidden;margin-right:8px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.pct{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.statTable .wrong{color:var(--muted);font-size:15px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

.overlay{position:fixed;inset:0;background:rgba(5,8,30,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
@media (prefers-reduced-motion: reduce){.col .bar,.col .who,.col .pts{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<canvas id="confetti" hidden></canvas>
<div class="overlay" id="ov" hidden></div>

<script>
(() => {
/* ================= 即時房間核心（學生頁與老師頁共用） =================
   正式：Firebase（匿名登入＋Firestore）。FIREBASE_CONFIG 由 build.py 填入。
   測試：網址加 ?mock=1，只在同一個瀏覽器的分頁之間同步（localStorage＋BroadcastChannel）。 */
const FIREBASE_CONFIG = {"apiKey": "AIzaSyDRp37denZjOkq9yxuIAQogPTfB07OGaN0", "authDomain": "chip-ep4.firebaseapp.com", "projectId": "chip-ep4", "storageBucket": "chip-ep4.firebasestorage.app", "messagingSenderId": "459946437624", "appId": "1:459946437624:web:6649b1d428fdfbe1ef440d"};
const FB_VER = '11.10.0';
const LIVE_MOCK = /[?&]mock=1(&|$)/.test(location.search);
const LIVE_ENABLED = LIVE_MOCK || !!FIREBASE_CONFIG;
const ROOM_TTL = 12 * 3600 * 1000;   // 房間 12 小時後可以被新的一場重複使用

function liveBackend(){
  if (!liveBackend.p) liveBackend.p = LIVE_MOCK ? mockBackend() : firebaseBackend();
  return liveBackend.p;
}

async function firebaseBackend(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [App, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = App.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app);
  // 強制長輪詢：避免學校網路的代理伺服器或防毒軟體把即時推送暫存起來，造成延遲
  const db = F.initializeFirestore(app, { experimentalForceLongPolling: true, experimentalLongPollingOptions: { timeoutSeconds: 10 } });
  await new Promise(res => { const off = Au.onAuthStateChanged(auth, () => { off(); res(); }); });
  const roomRef = pin => F.doc(db, 'rooms', pin);
  const playerRef = (pin, uid) => F.doc(db, 'rooms', pin, 'players', uid);
  return {
    kind: 'firebase',
    async uid(){ if (!auth.currentUser) await Au.signInAnonymously(auth); return auth.currentUser.uid; },
    async newIdentity(){ await Au.signOut(auth); await Au.signInAnonymously(auth); return auth.currentUser.uid; },
    async roomGet(pin){ const s = await F.getDoc(roomRef(pin)); return s.exists() ? s.data() : null; },
    async roomCreate(pin, data){
      try {
        await F.runTransaction(db, async tx => {
          const s = await tx.get(roomRef(pin));
          if (s.exists() && s.data().createdAt > Date.now() - ROOM_TTL) throw new Error('taken');
          tx.set(roomRef(pin), data);
        });
        return true;
      } catch(e){ return false; }
    },
    roomUpdate(pin, patch){ return F.updateDoc(roomRef(pin), patch); },
    roomWatch(pin, cb){ return F.onSnapshot(roomRef(pin), s => cb(s.exists() ? s.data() : null), e => cb(undefined, e)); },
    playerSet(pin, uid, data){ return F.setDoc(playerRef(pin, uid), data, { merge:true }); },
    playerWatch(pin, uid, cb){ return F.onSnapshot(playerRef(pin, uid), s => cb(s.exists() ? s.data() : null), e => cb(undefined, e)); },
    playersWatch(pin, cb){ return F.onSnapshot(F.collection(db, 'rooms', pin, 'players'), qs => cb(qs.docs.map(d => Object.assign({ id:d.id }, d.data()))), e => cb(undefined, e)); },
    playerDelete(pin, uid){ return F.deleteDoc(playerRef(pin, uid)); },
    roomDelete(pin){ return F.deleteDoc(roomRef(pin)); },
    // 每位學生每一題第一次的作答（只有開房老師讀得到）
    answerSet(pin, uid, data){ return F.setDoc(F.doc(db, 'rooms', pin, 'answers', uid), data); },
    answersWatch(pin, cb){ return F.onSnapshot(F.collection(db, 'rooms', pin, 'answers'), qs => cb(qs.docs.map(d => Object.assign({ id:d.id }, d.data()))), e => cb(undefined, e)); },
    answerDelete(pin, uid){ return F.deleteDoc(F.doc(db, 'rooms', pin, 'answers', uid)); },
  };
}

async function mockBackend(){
  const KEY = 'wm-mockdb', chan = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { rooms:{} }; } catch(e){ return { rooms:{} }; } };
  const subs = new Set();
  const fire = () => subs.forEach(f => f());
  const write = fn => { const d = load(); fn(d); localStorage.setItem(KEY, JSON.stringify(d)); if (chan) chan.postMessage(1); setTimeout(fire, 0); };
  if (chan) chan.onmessage = fire;
  window.addEventListener('storage', e => { if (e.key === KEY) fire(); });
  const watch = fn => { subs.add(fn); setTimeout(fn, 0); return () => subs.delete(fn); };
  const newId = () => { const id = 'u' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('wm-mock-uid', id); return id; };
  return {
    kind: 'mock',
    async uid(){ return sessionStorage.getItem('wm-mock-uid') || newId(); },
    async newIdentity(){ return newId(); },
    async roomGet(pin){ const r = load().rooms[pin]; return r ? r.data : null; },
    async roomCreate(pin, data){
      const r = load().rooms[pin];
      if (r && r.data.createdAt > Date.now() - ROOM_TTL) return false;
      write(d => { d.rooms[pin] = { data, players:{} }; });
      return true;
    },
    async roomUpdate(pin, patch){ write(d => { Object.assign(d.rooms[pin].data, patch); }); },
    roomWatch(pin, cb){ let last; return watch(() => { const r = load().rooms[pin]; const j = JSON.stringify(r ? r.data : null); if (j !== last){ last = j; cb(r ? r.data : null); } }); },
    async playerSet(pin, uid, data){ write(d => { const r = d.rooms[pin]; r.players[uid] = Object.assign(r.players[uid] || {}, data); }); },
    playerWatch(pin, uid, cb){ let last; return watch(() => { const r = load().rooms[pin]; const p = r ? r.players[uid] || null : null; const j = JSON.stringify(p); if (j !== last){ last = j; cb(p); } }); },
    playersWatch(pin, cb){ let last; return watch(() => { const r = load().rooms[pin]; const list = r ? Object.entries(r.players).map(([id, v]) => Object.assign({ id }, v)) : []; const j = JSON.stringify(list); if (j !== last){ last = j; cb(list); } }); },
    async playerDelete(pin, uid){ write(d => { delete d.rooms[pin].players[uid]; }); },
    async roomDelete(pin){ write(d => { delete d.rooms[pin]; }); },
    async answerSet(pin, uid, data){ write(d => { const r = d.rooms[pin]; r.answers = r.answers || {}; r.answers[uid] = data; }); },
    answersWatch(pin, cb){ let last; return watch(() => { const r = load().rooms[pin]; const list = r && r.answers ? Object.entries(r.answers).map(([id, v]) => Object.assign({ id }, v)) : []; const j = JSON.stringify(list); if (j !== last){ last = j; cb(list); } }); },
    async answerDelete(pin, uid){ write(d => { const r = d.rooms[pin]; if (r && r.answers) delete r.answers[uid]; }); },
  };
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },

/* ---------- 共用頂列 ---------- */
function topBar(right){
  return `<div class="top"><div class="brand"><div class="eb">晶片系列 EP4 · 時空任務 · 老師投影</div><h1>導線走線大師</h1></div><div class="tools">${right || ''}<button class="btn ghost" type="button" data-fs>全螢幕</button></div></div>`;
}
function bindTop(){
  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch(e){}
  });
}

/* ---------- 首頁 ---------- */
function renderHome(msg){
  view = 'home'; stopWatch();
  const last = store.get(HKEY, null);
  const canResume = last && last.createdAt > Date.now() - ROOM_TTL;
  $('app').innerHTML = topBar() + `<div class="home">
    <img src="${BOT}" alt="晶片小八">
    <p>開一場即時挑戰：學生用平板掃 QR code 加入，投影幕上即時顯示每個人走到哪一站、收集了幾個零件。</p>
    ${LIVE_ENABLED ? '' : '<p class="note warn">即時排行還沒有連上資料庫（Firebase 尚未設定），目前無法開房間。</p>'}
    <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center">
      <button class="btn huge" type="button" id="newRoom" ${LIVE_ENABLED ? '' : 'disabled'}>開新的一場</button>
      ${canResume && LIVE_ENABLED ? `<button class="btn ghost" type="button" id="resumeRoom">回到房間 ${esc(last.pin)}</button>` : ''}
    </div>
    <p class="note" id="homeMsg">${esc(msg || '')}</p>
  </div>`;
  bindTop();
  const n = $('newRoom'); if (n) n.onclick = createRoom;
  const r = $('resumeRoom'); if (r) r.onclick = () => openRoom(last.pin);
}

async function ensureBackend(){
  if (!be){ be = await liveBackend(); uid = await be.uid(); }
}
async function createRoom(){
  const b = $('newRoom'); b.disabled = true; b.textContent = '準備中…';
  try {
    await ensureBackend();
    for (let i = 0; i < 25; i++){
      const p = String(1000 + Math.floor(Math.random() * 9000));
      const now = Date.now();
      if (await be.roomCreate(p, { host:uid, status:'lobby', createdAt:now, startedAt:0, endedAt:0 })){
        store.set(HKEY, { pin:p, createdAt:now });
        return openRoom(p);
      }
    }
    throw new Error('busy');
  } catch(e){
    renderHome('開房間失敗，請檢查網路後再試一次。');
  }
}
async function openRoom(p){
  try { await ensureBackend(); } catch(e){ return renderHome('連不上資料庫，請檢查網路。'); }
  pin = p; stopWatch();
  offRoom = be.roomWatch(pin, r => {
    if (r === undefined) return;
    if (!r || r.host !== uid){ store.del(HKEY); return renderHome('這個房間已經不存在了。'); }
    const prev = room ? room.status : null; room = r;
    if (r.status === 'lobby' && view !== 'lobby') renderLobby();
    else if (r.status === 'playing' && view !== 'board') renderBoard();
    else if (r.status === 'ended' && prev !== 'ended' && view !== 'podium') renderPodium();
    else refresh();
  });
  offPlayers = be.playersWatch(pin, list => {
    if (!list) return;
    const since = room ? room.createdAt : 0;
    players = list.filter(p => (p.joinedAt || 0) >= since - 60000);
    const now = Date.now();
    players.forEach(p => { const r = reached[p.id]; if (!r || p.score > r.score) reached[p.id] = { score:p.score, at: r && p.score <= r.score ? r.at : now }; });
    refresh();
  });
  answers = {};
  watchAnswers(p);
}
// 作答紀錄的監聽如果被拒絕（例如規則還沒更新），每 5 秒重新試一次
function watchAnswers(p){
  if (offAnswers) offAnswers();
  offAnswers = be.answersWatch(p, list => {
    if (pin !== p) return;
    if (list === undefined){ offAnswers = null; setTimeout(() => { if (pin === p && !offAnswers) watchAnswers(p); }, 5000); return; }
    if (!list) return;
    const since = room ? room.createdAt : 0;
    answers = {};
    list.forEach(a => { if ((a.updatedAt || 0) >= since - 60000) answers[a.id] = a; });
    if (statsOpen) drawStats();
  });
}
function stopWatch(){ if (offRoom) offRoom(); if (offPlayers) offPlayers(); if (offAnswers) offAnswers(); offRoom = offPlayers = offAnswers = null; statsOpen = false; clearInterval(timer); timer = null; }
function refresh(){ if (view === 'lobby') drawLobbyList(); else if (view === 'board') drawBoard(); else if (view === 'podium' && (!frozen || !frozen.length) && players.length) drawPodium(true); }

/* ---------- 移出學生（點兩下） ---------- */
let armed = null;
function askRemove(el, id, name){
  if (armed !== id){
    armed = id; el.classList.add('confirm'); const old = el.innerHTML; el.textContent = `移出 ${name}？再點一次`;
    setTimeout(() => { if (armed === id){ armed = null; refresh(); } }, 3000);
    return;
  }
  armed = null; be.playerDelete(pin, id).catch(() => {}); be.answerDelete(pin, id).catch(() => {});
}

/* ---------- 大廳 ---------- */
function renderLobby(){
  view = 'lobby';
  $('app').innerHTML = topBar(`<button class="btn ghost" type="button" id="endEarly">取消這一場</button>`) + `<div class="lobby">
    <div class="qrCard"><div class="qr" id="qr"></div><div class="u">${esc(studentUrl(pin).replace(/^https?:\/\//, ''))}</div></div>
    <div>
      <div class="pinBox"><div class="lab">房間代碼</div><div class="pin">${esc(pin)}</div>
        <p class="how">用平板掃左邊的 QR code 加入。<br>或打開 <b>${esc(studentBase().replace(/^https?:\/\//, ''))}</b>，輸入房間代碼。</p></div>
      <div class="joined">已加入 <b id="joinN">0</b> 人</div>
      <div class="chips" id="chips"></div>
      <p class="legend" style="margin-top:10px">名字不恰當的話，點兩下那個名字就能把他移出房間。</p>
      <div class="lobbyAct"><button class="btn huge" type="button" id="startBtn">開始！</button></div>
    </div></div>`;
  bindTop();
  if (window.QRCode) new QRCode($('qr'), { text:studentUrl(pin), width:340, height:340, correctLevel:QRCode.CorrectLevel.M });
  $('startBtn').onclick = () => { $('startBtn').disabled = true; be.roomUpdate(pin, { status:'playing', startedAt:Date.now() }).catch(() => { $('startBtn').disabled = false; }); };
  $('endEarly').onclick = () => closeRoom(true, '已取消這一場，資料已刪除。');
  drawLobbyList();
}
function drawLobbyList(){
  const box = $('chips'); if (!box) return;
  $('joinN').textContent = players.length;
  const sorted = players.slice().sort((a,b) => (a.joinedAt || 0) - (b.joinedAt || 0));
  box.innerHTML = sorted.length ? sorted.map(p => `<button type="button" class="chipName" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('') : '<span class="note">等待學生加入…</span>';
  box.querySelectorAll('.chipName').forEach(b => b.onclick = () => { const p = players.find(x => x.id === b.dataset.id); if (p) askRemove(b, p.id, p.name); });
}

/* ---------- 排行榜 ---------- */
function ranked(){
  return players.slice().sort((a,b) =>
    (b.score || 0) - (a.score || 0) ||
    ((reached[a.id] || {}).at || 0) - ((reached[b.id] || {}).at || 0) ||
    String(a.name).localeCompare(String(b.name), 'zh-Hant'));
}
function renderBoard(){
  view = 'board';
  $('app').innerHTML = topBar(`
    <div class="stat"><span>房間</span><b class="pinMini">${esc(pin)}</b></div>
    <div class="stat"><span>人數</span><b id="sN">0</b></div>
    <div class="stat"><span>完成</span><b id="sD">0</b></div>
    <div class="stat"><span>時間</span><b id="sT">00:00</b></div>
    <button class="btn ghost" type="button" id="showQr">讓更多人加入</button>
    <button class="btn ghost" type="button" id="statsBtn">各題答對情況</button>
    <button class="btn" type="button" id="endBtn">結束並頒獎</button>`) + `
    <div class="boardHead" id="bh"><span>名次</span><span>工程師</span><div class="stopsHead">${STOPS.map((s, i) => `<span><em>${i + 1}</em><b>${s}</b></span>`).join('')}</div><span>零件</span><span style="text-align:right">分數</span></div>
    <div class="rows" id="rows"></div>
    <p class="legend">分數：每通過一關 +100，一次就答對的任務再 +100。同分時，先到的排前面。點兩下名字可以移出房間。</p>`;
  bindTop();
  $('endBtn').onclick = () => { $('endBtn').disabled = true; be.roomUpdate(pin, { status:'ended', endedAt:Date.now() }).catch(() => { $('endBtn').disabled = false; }); };
  $('showQr').onclick = showQrOverlay;
  $('statsBtn').onclick = showStats;
  clearInterval(timer);
  const tick = () => { const end = room && room.status === 'ended' && room.endedAt ? room.endedAt : Date.now(); const t = room && room.startedAt ? Math.max(0, Math.floor((end - room.startedAt) / 1000)) : 0; const el = $('sT'); if (el) el.textContent = String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); };
  tick(); timer = setInterval(tick, 1000);
  drawBoard();
}
function rowHTML(p, i){
  const stop = Math.max(0, Math.min(7, p.stop || 0));
  const track = STOPS.map((_, k) => `<i class="${p.done ? 'on' : k < stop ? 'on' : k === stop ? 'now' : ''}"></i>`).join('');
  const parts = PART_COLORS.map((c, k) => k < (p.parts || 0) ? `<span class="got" style="background:${c}"></span>` : '<span></span>').join('');
  return `<div class="row" data-id="${esc(p.id)}"><div class="rk">${i + 1}</div>
    <div class="nm" data-id="${esc(p.id)}">${esc(p.name)}${p.done ? '<span class="done">完成</span>' : ''}${p.cls ? `<small>${esc(p.cls)}</small>` : ''}</div>
    <div class="track${p.done ? ' fin' : ''}">${track}</div><div class="parts">${parts}</div><div class="score">${p.score || 0}</div></div>`;
}
function drawBoard(){
  const box = $('rows'); if (!box) return;
  const list = ranked();
  $('sN').textContent = list.length;
  $('sD').textContent = list.filter(p => p.done).length;
  // FLIP：記住舊位置
  const before = {}; box.querySelectorAll('.row').forEach(r => { before[r.dataset.id] = r.getBoundingClientRect().top; });
  box.className = 'rows' + (list.length > 16 ? ' two compact' : list.length > 10 ? ' compact' : '');
  $('bh').className = 'boardHead' + (list.length > 16 ? ' two' : '');
  if (list.length > 16) box.style.gridTemplateRows = `repeat(${Math.ceil(list.length / 2)}, auto)`; else box.style.gridTemplateRows = '';
  box.innerHTML = list.length ? list.map(rowHTML).join('') : '<div class="empty">還沒有學生加入</div>';
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
    box.querySelectorAll('.row').forEach(r => {
      const old = before[r.dataset.id]; if (old == null) return;
      const dy = old - r.getBoundingClientRect().top; if (!dy) return;
      r.animate([{ transform:`translateY(${dy}px)` }, { transform:'translateY(0)' }], { duration:600, easing:'cubic-bezier(.2,.8,.2,1)' });
    });
  }
  box.querySelectorAll('.nm').forEach(n => n.onclick = () => { const p = players.find(x => x.id === n.dataset.id); if (p) askRemove(n, p.id, p.name); });
}
function showQrOverlay(){
  const ov = $('ov');
  ov.innerHTML = `<div class="qrCard"><div class="pinBox" style="text-align:center"><div class="lab" style="color:#5a6286">房間代碼</div><div class="pin" style="font-size:72px">${esc(pin)}</div></div><div class="qr" id="qr2"></div><div class="u">${esc(studentUrl(pin).replace(/^https?:\/\//, ''))}</div><button class="btn" type="button" id="closeQr">關閉</button></div>`;
  ov.hidden = false;
  if (window.QRCode) new QRCode($('qr2'), { text:studentUrl(pin), width:300, height:300, correctLevel:QRCode.CorrectLevel.M });
  $('closeQr').onclick = () => { ov.hidden = true; ov.innerHTML = ''; };
}

/* ---------- 頒獎台 ---------- */
function renderPodium(){
  view = 'podium'; clearInterval(timer); frozen = players.length ? ranked() : null;
  $('app').innerHTML = topBar(`<button class="btn ghost" type="button" id="backBoard">看完整排行</button><button class="btn ghost" type="button" id="statsBtn2">各題答對情況</button><button class="btn ghost" type="button" id="csvBtn">下載成績</button><button class="btn ghost" type="button" id="again">開新的一場</button><button class="btn danger" type="button" id="wipe">刪除這場的資料</button>`) + `
    <div style="text-align:center;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,4vw,54px);letter-spacing:.08em">晶片工程師頒獎台</div>
    <div class="podium" id="podium"></div><div class="rest" id="rest"></div>`;
  bindTop();
  $('backBoard').onclick = () => { frozen = null; renderBoard(); };
  $('again').onclick = () => { store.del(HKEY); stopWatch(); renderHome(); };
  $('statsBtn2').onclick = showStats;
  $('csvBtn').onclick = downloadCsv;
  $('wipe').onclick = () => {
    const b = $('wipe');
    if (b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = '確定刪除？刪了就找不回來，記得先下載成績'; setTimeout(() => { if (b.isConnected){ b.dataset.armed = ''; b.textContent = '刪除這場的資料'; } }, 5000); return; }
    closeRoom(true);
  };
  drawPodium(true);
}
function drawPodium(animate){
  const box = $('podium'); if (!box) return;
  if (!frozen || !frozen.length) frozen = players.length ? ranked() : null;
  const list = frozen || [], top = list.slice(0, 3);
  const order = [1, 0, 2], H = ['26vh', '36vh', '18vh'];
  box.innerHTML = order.map(i => top[i] ? `<div class="col p${i + 1}" data-i="${i}"><div class="who">${esc(top[i].name)}</div><div class="pts">${top[i].score || 0} 分</div><div class="bar">${i + 1}</div></div>` : '').join('');
  $('rest').innerHTML = list.slice(3).map((p, k) => `<span><b>${k + 4}</b>${esc(p.name)}</span>`).join('');
  const cols = [...box.querySelectorAll('.col')];
  const show = col => { col.querySelector('.bar').style.height = H[+col.dataset.i === 0 ? 1 : +col.dataset.i === 1 ? 0 : 2]; col.classList.add('show'); };
  if (!animate){ cols.forEach(show); return; }
  const seq = [2, 1, 0];
  seq.forEach((rank, n) => setTimeout(() => { const c = cols.find(x => +x.dataset.i === rank); if (c) show(c); if (rank === 0) confetti(); }, 500 + n * 1100));
}
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confetti'); cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const g = cv.getContext('2d'), cols = ['#ffd166','#2fd0bd','#e48fcb','#8fa2ff','#f2b733','#ffffff'];
  const ps = Array.from({ length:180 }, () => ({ x:Math.random() * cv.width, y:-20 - Math.random() * cv.height * .5, vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 4, r:Math.random() * Math.PI, w:6 + Math.random() * 8, c:cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const step = t => {
    g.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w/2, -p.w/4, p.w, p.w/2); g.restore(); });
    if (t - t0 < 4500) requestAnimationFrame(step); else { g.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  };
  requestAnimationFrame(step);
}

/* ---------- 各題答對情況 ---------- */
function showStats(){
  statsOpen = true;
  const ov = $('ov');
  ov.innerHTML = `<div class="statCard" role="dialog" aria-modal="true" aria-label="各題答對情況">
    <div class="statHead"><div><h2>各題答對情況</h2><p>「第一次就答對」是學生第一次作答、還沒看到任何提示或回饋時就答對的人數。</p></div>
      <div class="tools"><button class="btn" type="button" id="csvBtn2">下載成績</button><button class="btn ghost" type="button" id="closeStats">關閉</button></div></div>
    <div id="statsBody"></div></div>`;
  ov.hidden = false;
  $('closeStats').onclick = () => { statsOpen = false; ov.hidden = true; ov.innerHTML = ''; };
  $('csvBtn2').onclick = downloadCsv;
  drawStats();
}
function drawStats(){
  const box = $('statsBody'); if (!box) return;
  const list = Object.values(answers);
  if (!list.length){
    box.innerHTML = `<p class="note" style="padding:20px 0">還沒有收到作答紀錄。學生答完第 1 題後就會出現。<br>如果學生已經在作答卻一直沒有資料，請確認 Firebase 的安全規則已經更新。</p>`;
    return;
  }
  box.innerHTML = `<table class="statTable"><thead><tr><th>題目</th><th class="num">第一次就答對</th><th>比例</th><th>最常選的錯誤答案</th></tr></thead><tbody>` +
    QMETA.map(m => {
      const got = list.filter(a => a.q && a.q[m.id]);
      const n = got.length, ok = got.filter(a => a.q[m.id].ok).length;
      const pct = n ? Math.round(ok / n * 100) : 0;
      const wrong = {};
      if (!m.noBreakdown) got.filter(a => !a.q[m.id].ok).forEach(a => { const k = a.q[m.id].a || '（空白）'; wrong[k] = (wrong[k] || 0) + 1; });
      const top = Object.entries(wrong).sort((x, y) => y[1] - x[1]).slice(0, 3).map(([k, c]) => `${esc(k)} ×${c}`).join('、');
      return `<tr><td>${esc(m.label)}${m.note ? `<small>（${esc(m.note)}）</small>` : ''}</td>
        <td class="num"><b>${ok}</b> / ${n} 人</td>
        <td><div class="pbar"><i style="width:${pct}%"></i></div><span class="pct">${n ? pct + '%' : '還沒有人作答'}</span></td>
        <td class="wrong">${top || (n ? (m.noBreakdown ? '' : '沒有人答錯') : '')}</td></tr>`;
    }).join('') + `</tbody></table><p class="legend" style="margin-top:12px">已收到 ${list.length} 位學生的作答紀錄。被移出的學生不列入。</p>`;
}
function downloadCsv(){
  const rk = ranked();
  const head = ['名次', '姓名', '班級', '分數', '完成全部'].concat(...QMETA.map(m => [m.short + ' 第一次', m.short + ' 作答']));
  const rows = rk.map((p, i) => [i + 1, p.name, p.cls || '', p.score || 0, p.done ? '是' : '否'].concat(...QMETA.map(m => {
    const a = answers[p.id] && answers[p.id].q && answers[p.id].q[m.id];
    return a ? [a.ok ? '○' : '╳', a.a] : ['', ''];
  })));
  const list = Object.values(answers);
  const sum = ['', '第一次就答對人數', '', '', ''].concat(...QMETA.map(m => {
    const got = list.filter(a => a.q && a.q[m.id]);
    return [`${got.filter(a => a.q[m.id].ok).length}/${got.length}`, ''];
  }));
  const csv = '﻿' + [head].concat(rows, [[]], [sum]).map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `導線走線大師_房間${pin}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- 關閉房間 ---------- */
async function closeRoom(wipe, msg){
  const p = pin;
  stopWatch(); store.del(HKEY);
  try {
    if (wipe){
      const ids = new Set(players.map(pl => pl.id).concat(Object.keys(answers)));
      for (const id of ids){ await be.playerDelete(p, id).catch(() => {}); await be.answerDelete(p, id).catch(() => {}); }
      await be.roomDelete(p);
    }
    else await be.roomUpdate(p, { status:'ended', endedAt:Date.now() });
  } catch(e){}
  room = null; players = []; pin = null;
  renderHome(msg || (wipe ? '這一場的資料已經刪除。' : '已取消這一場。'));
}

renderHome();
})();
</script>
